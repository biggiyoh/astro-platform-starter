<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soirées</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="logo">✦ Soirées</div>
      <p id="tagline">Découvrez les soirées près de chez vous</p>
    </header>

    <div id="map"></div>

    <div id="panel">
      <button id="close-btn" aria-label="Fermer">✕</button>

      <div id="panel-inner">
        <div id="event-info">
          <span id="event-tag"></span>
          <h2 id="event-title"></h2>
          <div id="event-meta">
            <span id="event-date"></span>
            <span id="event-location"></span>
            <span id="event-spots"></span>
          </div>
          <p id="event-desc"></p>
          <a id="book-btn" href="#" target="_blank" rel="noopener">
            Réserver ma place →
          </a>
        </div>

        <div id="chat-section">
          <div id="chat-header">
            <div id="chat-avatar">💬</div>
            <div>
              <strong>Discussion de la soirée</strong>
              <small>Chat public · Posez vos questions</small>
            </div>
          </div>
          <div id="messages"></div>
          <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Écrire un message…" autocomplete="off">
            <button id="send-btn" aria-label="Envoyer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="events.js"></script>
  <script src="app.js"></script>
</body>
</html>
